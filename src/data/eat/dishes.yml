      hours: 10:00〜22:00（毎日）
      note: 石の器で出てくる甘くて濃いボーコー。パン・麺・ごはんを選べます。団地の1階にあるので住所を見せて向かいましょう。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/bo-kho-ganh
  sources:
    - title: MICHELIN Guide Vietnam — Bò Kho Gánh
