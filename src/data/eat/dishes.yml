- id: ca-phe-sua-da
  order: 12
  nameVi: Cà phê sữa đá
  nameJa: カフェスアダー（練乳アイスコーヒー）
  category: drink
  imageAlt: グラスに入った練乳アイスコーヒー
  priceVnd: { min: 25000, max: 60000 }
  desc: 濃く淹れたコーヒーに練乳を合わせ、氷を入れたベトナムの定番。濃厚な甘さが暑さで疲れた体にしみます。
  tip: 甘さ控えめにしたいときは「Ít ngọt」とひとこと。
  phrases:
    - { vi: Cho tôi một ly cà phê sữa đá, kana: チョー トイ モッ リー カー フェー スア ダー, ja: 練乳アイスコーヒーをひとつください }
    - { vi: Ít ngọt nhé, kana: イッ ゴッ ニェ, ja: 甘さ控えめで }
  shops:
    - name: Cà Phê Vợt Cheo Leo
      area: 旧3区・路地の奥
      address: 109/36 Nguyễn Thiện Thuật, Quận 3, TP.HCM
      hours: 6:00〜18:00
      note: 1938年創業、サイゴンでいちばん古いといわれる布ドリップ（vợt）のコーヒー店。路地の中の小さな椅子で地元気分を。
      source: https://www.ngoctrainui.vn/2024/07/09/ca-phe-vot-cheo-leo-quan-3-sai-gon/
