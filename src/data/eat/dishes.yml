# /eat/ — must-try dishes and where to eat them. Kana follows the Southern accent, like phrases/.
# priceVnd: rough ranges per bowl/plate (verified: false until checked in Ho Chi Minh City).
# shops: picked from the MICHELIN Guide Vietnam 2026 (Bib Gourmand) and Vietnamese review sites.
#   address = as written by the source (new ward names after the 2025 merger; old district in `area`).
#   Hours change often: unverified ones are marked TODO and shown as 要確認.
- id: pho
  order: 1
  nameVi: Phở
  nameJa: フォー
  category: main
  when: 朝ごはんに
  imageAlt: 牛肉とネギがのったフォーの丼
  priceVnd: { min: 40000, max: 90000 }
  desc: 米麺を牛骨スープでいただく、ベトナムを代表する麺。南部風はもやしやバジルなどのハーブをたっぷり添えるのが特徴です。
  tip: ベトナムではフォーは朝ごはん。牛肉（bò）と鶏肉（gà）が定番です。
  phrases:
    - { vi: Cho tôi một tô phở bò, kana: チョー トイ モッ トー フォー ボー, ja: 牛肉のフォーをひとつください }
    - { vi: Không hành, kana: コン ハン, ja: ネギ抜きで }
  shops:
    - name: Phở Minh
      area: 旧1区・グエンフエ通りの近く（路地の奥）
      address: 63/6 Pasteur, Phường Sài Gòn, TP.HCM
      hours: 6:30〜10:30（毎日・売り切れ次第終了）
      note: 1945年創業。路地の奥にある老舗で、焼きたてのパテ・ショー（ミートパイ）も名物。1日目の朝ごはんに。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/pho-minh
    - name: Phở Lệ
      area: 旧5区・チョロン
      address: 413-415 Nguyễn Trãi, Phường An Đông, TP.HCM
      hours: 6:00〜24:00（毎日）
      note: 70年以上続く人気店。生肉・煮込み肉・牛団子がのった「ミックス」が定番。2日目のチョロン散策の朝に。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/pho-le-district-5
    - name: Phở Chào
      area: 旧ビンタイン区（中心部から配車で）
      address: 52 Nguyễn Công Trứ, Phường Thạnh Mỹ Tây, TP.HCM
      hours: 6:30〜21:00（毎日）
      note: 3日間煮込んだ牛骨スープと鶏スープを選べます。夜も開いているので夕食にも。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/pho-chao
  sources:
    - title: 21 must-try Vietnamese dishes（ベトナム政府観光局 Vietnam Tourism）
      url: https://vietnam.travel/things-to-do/21-must-try-vietnamese-dishes/
  verified: false

- id: com-tam
  order: 2
  nameVi: Cơm tấm
  nameJa: コムタム
  category: main
  when: 朝〜夜に
  imageAlt: 焼いた骨付き豚肉と砕き米のごはん
  priceVnd: { min: 35000, max: 90000 }
  desc: 砕けたお米のごはんに、甘辛く焼いた豚肉をのせたホーチミン名物。目玉焼きや甘酸っぱい漬物を添えて、タレをかけていただきます。
  tip: 定番は焼き豚（sườn）に目玉焼き（ốp la）をのせた一皿。
  phrases:
    - { vi: Cho tôi một dĩa cơm tấm sườn, kana: チョー トイ モッ イア コム タム スオン, ja: 焼き豚のコムタムをひとつください }
    - { vi: Thêm trứng ốp la, kana: テム チュン オップ ラー, ja: 目玉焼きを追加で }
  shops:
    - name: Cơm Tấm Ba Ghiền
      area: 旧フーニュアン区（中心部から配車で）
      address: 84 Đặng Văn Ngữ, Phường Phú Nhuận, TP.HCM
      hours: 9:00〜21:30（毎日）
      note: 「街でいちばん」と地元で評判。秘伝のタレで炭火焼きにした大きな豚ロースが看板です。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/com-tam-ba-ghien
  sources:
    - title: 21 must-try Vietnamese dishes（ベトナム政府観光局 Vietnam Tourism）
      url: https://vietnam.travel/things-to-do/21-must-try-vietnamese-dishes/
  verified: false

- id: hu-tieu
  order: 3
  nameVi: Hủ tiếu
  nameJa: フーティウ
  category: main
  when: 朝〜夜に
  imageAlt: エビと豚肉がのったナムヴァン風フーティウ
  priceVnd: { min: 40000, max: 90000 }
  desc: 南部の屋台の定番麺。豚骨のやさしいスープに、豚肉やエビ、うずらの卵などがのります。「ナムヴァン風」が代表格です。
  tip: スープあり（nước）か、スープが別添えのまぜ麺（khô）を選べます。
  phrases:
    - { vi: Cho tôi một tô hủ tiếu Nam Vang, kana: チョー トイ モッ トー フー ティウ ナム ヤン, ja: ナムヴァン風フーティウをひとつください }
    - { vi: Cho tôi hủ tiếu khô, kana: チョー トイ フー ティウ コー, ja: スープなし（まぜ麺）でお願いします }
  shops:
    - name: Hồng Phát
      area: 旧3区・バンコー
      address: 389-391 Võ Văn Tần, Phường Bàn Cờ, TP.HCM
      hours: 6:30〜22:30
      note: 潮州とクメールの食文化から生まれた一杯。エビとカニの揚げ春巻きや揚げ餃子もおすすめ。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/hong-phat-district-3
  sources:
    - title: 21 must-try Vietnamese dishes（ベトナム政府観光局 Vietnam Tourism）
      url: https://vietnam.travel/things-to-do/21-must-try-vietnamese-dishes/
  verified: false

- id: banh-xeo
  order: 4
  nameVi: Bánh xèo
  nameJa: バインセオ
  category: main
  when: 昼〜夜に
  imageAlt: 黄色い生地のバインセオとハーブの盛り合わせ
  priceVnd: { min: 50000, max: 180000 }
  desc: 米粉の生地をパリッと焼き、エビや豚肉、もやしを包んだベトナム風お好み焼き。南部のものは大きくて薄いのが特徴です。
  tip: ちぎって葉野菜とハーブで包み、甘酸っぱいタレにつけて食べます。手を使ってOK。
  phrases:
    - { vi: Cho tôi một cái bánh xèo, kana: チョー トイ モッ カイ バン セオ, ja: バインセオをひとつください }
  shops:
    - name: Bánh Xèo 46A
      area: 旧1区・タンディン教会の近く
      address: 46A Đinh Công Tráng, Phường Tân Định, TP.HCM
      hours: 10:00〜13:50、16:00〜20:50（毎日）
      note: 70年以上続く名店。オープンキッチン横の屋外席がいちばんの雰囲気。閉店まぎわは避けて早めに。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/banh-xeo-46a
    - name: Bếp Mẹ Ỉn
      area: 旧1区・ベンタイン市場の近く
      address: 136 Lê Thánh Tôn, Phường Bến Thành, TP.HCM
      hours: 10:30〜22:30（毎日）
      note: 黄色い壁の、田舎の家のような店内。竹かごで出てくるバインセオと、ココナッツの器のチャーハンが看板。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/bep-me-in-le-thanh-ton
  sources:
    - title: 21 must-try Vietnamese dishes（ベトナム政府観光局 Vietnam Tourism）
      url: https://vietnam.travel/things-to-do/21-must-try-vietnamese-dishes/
  verified: false

- id: banh-canh-cua
  order: 5
  nameVi: Bánh canh cua
  nameJa: バインカン・クア（カニのとろみ麺）
  category: main
  when: 昼に
  imageAlt: エビとカニがのったオレンジ色のスープの麺
  priceVnd: { min: 50000, max: 120000 }
  desc: もちもちの太い米麺を、カニの旨みたっぷりのとろみスープでいただく一杯。カニ身や揚げパンをのせるのが南部流です。
  tip: 添えられた青唐辛子とライムのタレで、味を変えながら食べます。
  phrases:
    - { vi: Cho tôi một tô bánh canh cua, kana: チョー トイ モッ トー バン カン クア, ja: カニのバインカンをひとつください }
  shops:
    - name: Bánh Canh Cua Bà Ba
      area: 旧5区（1区との境目あたり・路地の中）
      address: 84/6 Nguyễn Biểu, Phường Chợ Quán, TP.HCM
      hours: 8:00〜20:00（月曜休み）
      note: メニューはこの一品だけ。ひとり用の小鉢と、シェア用の土鍋があります。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/banh-canh-cua-ba-ba
  sources:
    - title: MICHELIN Guide Vietnam — Bánh Canh Cua Bà Ba
      url: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/banh-canh-cua-ba-ba
  verified: false

- id: bun-rieu
  order: 6
  nameVi: Bún riêu
  nameJa: ブンリウ（カニとトマトの麺）
  category: main
  when: 朝〜昼に
  imageAlt: トマトとカニのスープに米麺が入ったブンリウ
  priceVnd: { min: 40000, max: 80000 }
  desc: トマトとカニのやさしい酸味のスープに、細い米麺。カニ味噌の団子や揚げ豆腐がのり、日本人にも食べやすい味です。
  tip: エビの発酵ペースト（mắm tôm）はとても香りが強いので、まずはほんの少しから。
  phrases:
    - { vi: Cho tôi một tô bún riêu, kana: チョー トイ モッ トー ブン リウ, ja: ブンリウをひとつください }
    - { vi: Không mắm tôm, kana: コン マム トム, ja: エビの発酵ペーストは無しで }
  shops:
    - name: Bún Riêu Yến
      area: 旧フーニュアン区（中心部から配車で）
      address: 1346 Trường Sa, Phường Tân Sơn Hòa, TP.HCM
      hours: 6:00〜18:00（日曜は11:00まで）
      note: にぎやかな角の店。麺は細・太・平打ちから選べ、タニシと豚ひき肉がたっぷりのります。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/bun-rieu-yen
  sources:
    - title: MICHELIN Guide Vietnam — Bún Riêu Yến
      url: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/bun-rieu-yen
  verified: false

- id: bo-kho
  order: 7
  nameVi: Bò kho
  nameJa: ボーコー（牛肉のベトナム風シチュー）
  category: main
  when: 朝〜昼に
  imageAlt: 赤いスープのボーコーとフランスパン
  priceVnd: { min: 40000, max: 80000 }
  desc: 牛肉をレモングラスや八角で甘くスパイシーに煮込んだシチュー。フランスパンを浸して食べるのが定番です。
  tip: パン（bánh mì）・麺（hủ tiếu）・ごはんから選べる店が多いです。
  phrases:
    - { vi: Cho tôi một phần bò kho bánh mì, kana: チョー トイ モッ ファン ボー コー バン ミー, ja: ボーコーをパン付きでひとつください }
