- id: banh-cuon
  order: 9
  nameVi: Bánh cuốn
  nameJa: バインクオン（蒸し春巻き）
  category: snack
  when: 朝〜夜に
  imageAlt: 揚げエシャロットとハーブをのせたバインクオン
  priceVnd: { min: 35000, max: 80000 }
  desc: 薄く蒸した米の皮で、豚ひき肉とキクラゲを巻いたつるりとした一皿。軽いので朝ごはんや小腹がすいたときに。
  tip: ヌックマム（魚醤）の甘いタレにつけて。ベトナムハム（chả lụa）を添えるのが定番です。
  phrases:
    - { vi: Cho tôi một dĩa bánh cuốn, kana: チョー トイ モッ イア バン クオン, ja: バインクオンをひとつください }
  shops:
    - name: Bánh Cuốn Tây Hồ 127
      area: 旧1区・タンディン教会の近く
      address: 127 Đinh Tiên Hoàng, Phường Tân Định, TP.HCM
      hours: 5:30〜21:30（毎日）
      note: 屋台から始まった2階建ての人気店。オープンキッチンで注文ごとに蒸しあげます。黄金色の緑豆の揚げ菓子もぜひ。
      michelin: bib
      source: https://guide.michelin.com/us/en/ho-chi-minh/ho-chi-minh_2978179/restaurant/banh-cuon-tay-ho-127
  sources:
    - title: MICHELIN Guide Vietnam — Bánh Cuốn Tây Hồ 127
