slug: food
titleJa: 食事
order: 2
verified: true
phrases:
  - id: menu-please
    ja: メニューを見せてください
    vi: Cho em xem menu với
    kana: チョー エム セム メヌー ヨイ
    note: サイゴンでは「menu」でそのまま通じます。
  - id: this-one
    ja: これをください
    vi: Cho em cái này nha
    kana: チョー エム カイ ナイ ニャー
    note: メニューや料理を指さしながら使いましょう。
  - id: no-cilantro
    ja: パクチーは入れないでください
    vi: Đừng bỏ ngò nha
    kana: ドゥン ボー ンゴー ニャー
    note: 「ngò」は南部でパクチー（コリアンダー）のことです。
  - id: no-ice
    ja: 氷なしでお願いします
    vi: Không đá nha
    kana: コン ダー ニャー
  - id: iced-milk-coffee
    ja: 練乳アイスコーヒーをひとつください
    vi: Cho em một ly cà phê sữa đá
    kana: チョー エム モッ リー カー フェー スア ダー
    note: 練乳入りの甘いアイスコーヒーで、ベトナムの定番です。
  - id: bottled-water
    ja: お水（ペットボトル）をひとつください
    vi: Cho em một chai nước suối
    kana: チョー エム モッ チャイ ヌオック スオイ
    note: 「nước suối」は南部でボトル入りの水のことです。
  - id: delicious
    ja: すごくおいしいです！
    vi: Ngon quá!
    kana: ンゴン ワー
  - id: check-please
    ja: お会計お願いします
    vi: Chị ơi, tính tiền giùm em
    kana: チ オーイ、ティン ティエン ユム エム
    note: 男性の店員さんには「Anh ơi（アン オーイ）」。
