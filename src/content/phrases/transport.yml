slug: transport
titleJa: 移動（タクシー・配車アプリ）
order: 3
verified: true
phrases:
  - id: to-this-address
    ja: この住所までお願いします
    vi: Anh chở em tới địa chỉ này nha
    kana: アン チョー エム トイ ディア チー ナイ ニャー
    note: 地図アプリの画面や住所のメモと一緒に見せましょう。運転手が女性なら「Anh」を「Chị（チ）」に。
  - id: to-the-airport
    ja: 空港までお願いします
    vi: Cho em ra sân bay nha
    kana: チョー エム ラー サン バイ ニャー
  - id: stop-here
    ja: ここで降ります
    vi: Cho em xuống đây nha
    kana: チョー エム スオン ダイ ニャー
  - id: drive-slowly
    ja: ゆっくり走ってもらえますか
    vi: Anh chạy chậm chậm giùm em nha
    kana: アン チャイ チャム チャム ユム エム ニャー
  - id: turn-on-meter
    ja: メーターを入れてください
    vi: Anh bật đồng hồ giùm em nha
    kana: アン バッ ドン ホー ユム エム ニャー
    note: タクシーでメーターが動いていないときに使います。
  - id: turn-left
    ja: 左に曲がってください
    vi: Quẹo trái nha anh
    kana: ウェオ チャイ ニャー アン
    note: 「Quẹo」は南部の言い方です（北部では「Rẽ」）。
  - id: turn-right
    ja: 右に曲がってください
    vi: Quẹo phải nha anh
    kana: ウェオ ファイ ニャー アン
  - id: how-long
    ja: どのくらいかかりますか？
    vi: Đi bao lâu vậy anh?
    kana: ディー バオ ラウ ヤイ アン
